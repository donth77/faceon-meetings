name: Google Workspace add-on

# A google-addon-v* tag tests the add-on and attaches a developer's build of it to the
# tag's GitHub release. People get their own copy from FaceOn itself (Settings →
# Calendar), which keeps it up to date (google-addon/DEVELOPING.md).
on:
  push:
    tags: ["google-addon-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEON_URL: ${{ vars.FACEON_URL || 'https://joinfaceon.app' }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'FaceOn' }}
      GOOGLE_ADDON_CONFERENCE_LOGO_URL: ${{ vars.GOOGLE_ADDON_CONFERENCE_LOGO_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test google-addon
      - run: pnpm addon:build

      - name: Attach the add-on to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd google-addon/dist && zip -q "../../$GITHUB_REF_NAME.zip" Code.js appsscript.json)
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "The Google Workspace add-on, a developer's build for $FACEON_URL (google-addon/DEVELOPING.md). People add their own copy from FaceOn's Settings → Calendar."
          gh release upload "$GITHUB_REF_NAME" "$GITHUB_REF_NAME.zip" --clobber
