name: Desktop

# Desktop app builds (desktop/RELEASING.md). A desktop-v* tag, or "Run workflow", builds
# the Windows installer, unsigned, to try out; Windows releases are signed and published
# from the owner's PC. "Run workflow" can also make an unsigned Mac test build, or a Mac
# release: signed with the Developer ID certificate in the mac-release environment,
# notarized, checked, and uploaded to the version's release.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      mac:
        description: Also build an unsigned Mac test build
        type: boolean
        default: false
      mac_release:
        description: "Mac release: sign, notarize and upload to the version's draft, or attach to its published release"
        type: choice
        options: [none, draft, attach]
        default: none

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.mac_release == 'none'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DESKTOP_RELEASES_REPO: ${{ vars.DESKTOP_RELEASES_REPO }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      FACEON_APP_URL: ${{ vars.FACEON_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project desktop
      # No signing here yet, so it's for trying out, not for release.
      - run: pnpm --filter @faceon/desktop dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: desktop/release/*.exe
          retention-days: 14

  mac-test:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      FACEON_APP_URL: ${{ vars.FACEON_APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No certificate here, so it's unsigned: for trying out, not for release.
      - run: pnpm --filter @faceon/desktop dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: mac-unsigned
          path: desktop/release/*.dmg
          retention-days: 7

  mac-release:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_release != 'none' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    # The signing and notarization secrets live in this environment, which only runs on
    # main can use ("Signing the Mac app on GitHub" in desktop/RELEASING.md).
    environment: mac-release
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      FACEON_APP_URL: ${{ vars.FACEON_APP_URL }}
      DESKTOP_RELEASES_REPO: ${{ vars.DESKTOP_RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project desktop
      - name: Signing and notarization secrets
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERTS MAC_CERTS_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The mac-release environment is missing these secrets:$missing (desktop/RELEASING.md)."
            exit 1
          fi
          # notarytool and electron-builder take the App Store Connect key as a file.
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, check and upload
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
          WHERE: ${{ inputs.mac_release == 'attach' && '--attach' || '--publish' }}
        run: APPLE_API_KEY="$APPLE_API_KEY_FILE" pnpm --filter @faceon/desktop dist:mac "$WHERE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-release
          path: |
            desktop/release/*.dmg
            desktop/release/*-mac.zip
            desktop/release/*-mac.zip.blockmap
            desktop/release/latest-mac.yml
          if-no-files-found: ignore
          retention-days: 14
