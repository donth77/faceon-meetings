name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every push to main gets its own run, so each commit has a result even when several land
# in a row; on a branch or pull request, a new push cancels the older run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway database for the browser tests; it's gone when the job ends.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: faceon
          POSTGRES_PASSWORD: faceon
          POSTGRES_DB: faceon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://faceon:faceon@localhost:5432/faceon
      DATABASE_URL_UNPOOLED: postgresql://faceon:faceon@localhost:5432/faceon
      # The build bakes in the app's address; the browser tests serve it there.
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # Cloudflare's public test site key, so the build shows the check for a person. The
      # browser tests stand in for Cloudflare's script, and with no secret key the server
      # doesn't check.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # Page views counted, as on Vercel: the browser tests stand in for /_vercel/insights
      # and check what Vercel's script would send.
      NEXT_PUBLIC_VERCEL_ANALYTICS: "1"
      # Stream's development app, for the tests that join calls. Without these
      # repository secrets those tests are skipped, and everything else still runs.
      NEXT_PUBLIC_STREAM_API_KEY: ${{ secrets.STREAM_DEV_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_DEV_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm addon:build

      - name: Throwaway secrets for this run
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "GUEST_SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm build

      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Say whether the call tests run
        run: |
          if [ -z "$NEXT_PUBLIC_STREAM_API_KEY" ] || [ -z "$STREAM_API_SECRET" ]; then
            echo "::notice title=Browser tests::The tests that join calls were skipped. Set the STREAM_DEV_API_KEY and STREAM_DEV_API_SECRET repository secrets to run them."
            {
              echo "### Browser tests"
              echo ""
              echo "The tests that join calls were skipped, because the repository secrets **STREAM_DEV_API_KEY** and **STREAM_DEV_API_SECRET** aren't set (see DEPLOY.md, \"CI secrets\"). Every other browser test ran."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
